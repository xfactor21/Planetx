name: Command Center verify

on:
  pull_request:
    paths:
      - 'command-center/**'
      - '.github/workflows/command-center-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: command-center/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: API typecheck
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --types node --skipLibCheck api/search-console.ts api/social.ts
      - name: Build
        run: npm run build
      - name: Strict UI type audit
        continue-on-error: true
        run: npx tsc -p tsconfig.json
