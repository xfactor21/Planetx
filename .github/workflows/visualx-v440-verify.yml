name: Visual.X v4.4.0 Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visualx-v440-verify.yml'
      - 'visualx-build-manifest.json'
      - 'scripts/patch-visualx-v440-camera-wave-anatomy.mjs'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
