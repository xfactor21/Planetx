name: Analytics Summary Hygiene

on:
  pull_request:
    branches: ['main']
    paths:
      - 'supabase/functions/planetx-analytics-ingest/**'
      - 'scripts/analytics-summary-hygiene.mjs'
      - '.github/workflows/analytics-summary-hygiene.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analytics-summary-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify summary filtering contract
        run: node scripts/analytics-summary-hygiene.mjs
      - name: Verify deployed-source integration seam
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('supabase/functions/planetx-analytics-ingest/index.ts', 'utf8');
          if (!source.includes("from './summary-filter.mjs'")) throw new Error('Edge function does not import summary filter');
          if (!source.includes('const summaryRows=filterSummaryRows(rows)')) throw new Error('Summary boundary does not filter raw ledger rows');
          if (!source.includes('return summarize(req,summaryRows,product,sampled,from,to)')) throw new Error('Filtered rows are not passed to summarize');
          console.log('Edge summary integration contract passed.');
          NODE
